[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prior-auth-verifier"
version = "0.1.0"
description = "Prior authorization verification backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.8.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "openai>=1.50.0",
    "mistralai>=1.0.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.2.0",
    "huggingface-hub>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that call external services or heavy models",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["app"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
    "rank_bm25",
    "FlagEmbedding",
    "mistralai",
]
ignore_missing_imports = true
